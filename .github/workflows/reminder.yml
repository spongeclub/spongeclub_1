name: 과제 알림봇

on:
  schedule:
    # 매일 오전 9시 KST (UTC 00:00). 멱등 재예약이라 매일 돌아도 안전 —
    # 하루라도 Actions가 뜨면 그 주 알림이 보장된다.
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  schedule-reminders:
    runs-on: ubuntu-latest
    steps:
      - name: 이번 주 알림 재예약 (chat.scheduleMessage)
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
        run: |
          # ── 이번 주 월요일 계산 (실행 요일 무관) ──────────────
          # date +%u : 1(월) ~ 7(일). 오늘에서 (요일-1)일을 빼면 이번 주 월요일.
          DOW=$(TZ=Asia/Seoul date +%u)
          TODAY=$(TZ=Asia/Seoul date +%Y-%m-%d)
          MON=$(TZ=Asia/Seoul date -d "$TODAY -$((DOW - 1)) days" +%Y-%m-%d)

          THU=$(TZ=Asia/Seoul date -d "$MON +3 days" +%Y-%m-%d)
          FRI=$(TZ=Asia/Seoul date -d "$MON +4 days" +%Y-%m-%d)
          SAT=$(TZ=Asia/Seoul date -d "$MON +5 days" +%Y-%m-%d)
          SUN=$(TZ=Asia/Seoul date -d "$MON +6 days" +%Y-%m-%d)

          # 발송 시각 Unix timestamp (KST)
          THU_TS=$(TZ=Asia/Seoul date -d "$THU 19:00:00" +%s)
          FRI_AM_TS=$(TZ=Asia/Seoul date -d "$FRI 09:00:00" +%s)
          FRI_TS=$(TZ=Asia/Seoul date -d "$FRI 19:00:00" +%s)
          SAT_TS=$(TZ=Asia/Seoul date -d "$SAT 19:00:00" +%s)
          SUN_TS=$(TZ=Asia/Seoul date -d "$SUN 16:00:00" +%s)

          # ── 메시지 ────────────────────────────────────────────
          MSG_THU="🔔 이번 주 과제 리마인드!\n\n📱 SNS 마감: 내일(금) 자정!\n📝 과제 마감: 일요일 오후 7시\n\n토요일까지 전원 제출하면 🐚×2!\n일요일까지면 🐚×1!"
          MSG_FRI_AM="📱 오늘 자정까지 SNS 업로드 과제 제출 마감!\n🧽 잊기 전에 업로드하고 제출하기"
          MSG_FRI="📱 오늘 자정 SNS 업로드 과제 제출 마감!\n🧽 잊기 전에 업로드하고 제출하기"
          MSG_SAT="⏰ 과제 마감까지 24시간!\n지금 전원 제출하면 🐚×2 보너스!"
          MSG_SUN="🚨 3시간 남았어요!\n오늘 오후 7시까지!\nNEPDA is better than Perfect!!!!"

          CHANNELS=(
            "#1조-비비안"
            "#2조-띵크"
            "#3조-흐민"
            "#4조-다다"
            "#5조-오웬"
            "#6조-다니"
          )

          api() {
            # $1: API 메서드, $2: JSON 바디
            curl -s -X POST "https://slack.com/api/$1" \
              -H "Authorization: Bearer $SLACK_BOT_TOKEN" \
              -H "Content-Type: application/json; charset=utf-8" \
              -d "$2"
          }

          # ── 1) 기존 예약 전부 삭제 (멱등성 보장) ───────────────
          # 봇이 예약한 미발송 메시지를 모두 지운다. 그래야 이 워크플로우를
          # 몇 번 돌려도 중복 없이 "이번 주 알림 한 벌"만 남는다.
          echo "🧹 기존 예약 정리"
          LIST=$(api chat.scheduledMessages.list '{"limit":200}')
          PAIRS=$(echo "$LIST" | python3 -c "import sys,json; d=json.load(sys.stdin); print('\n'.join(m['id']+' '+m.get('channel_id','') for m in d.get('scheduled_messages',[]) if m.get('id') and m.get('channel_id')))" 2>/dev/null || echo "")

          DEL_COUNT=0
          if [ -n "$PAIRS" ]; then
            while read -r MID CID; do
              [ -z "$MID" ] && continue
              RESULT=$(api chat.deleteScheduledMessage "{\"channel\":\"$CID\",\"scheduled_message_id\":\"$MID\"}")
              OK=$(echo "$RESULT" | python3 -c "import sys,json; print(json.load(sys.stdin).get('ok',''))" 2>/dev/null || echo "")
              if [ "$OK" = "True" ]; then
                DEL_COUNT=$((DEL_COUNT + 1))
              else
                ERR=$(echo "$RESULT" | python3 -c "import sys,json; print(json.load(sys.stdin).get('error','unknown'))" 2>/dev/null || echo "parse_fail")
                echo "  ⚠️ 삭제 실패 ($MID): $ERR"
              fi
              sleep 1
            done <<< "$PAIRS"
          fi
          echo "  기존 예약 $DEL_COUNT건 삭제"
          echo ""

          # ── 2) 이번 주 알림 예약 ───────────────────────────────
          schedule_msg() {
            local ts=$1
            local msg=$2
            local label=$3

            local now
            now=$(date +%s)
            if [ "$ts" -le "$now" ]; then
              echo "⏭️ $label: 이미 지난 시간, 스킵"
              return
            fi

            for CHANNEL in "${CHANNELS[@]}"; do
              RESULT=$(api chat.scheduleMessage "{\"channel\":\"$CHANNEL\",\"text\":\"$msg\",\"post_at\":$ts}")
              OK=$(echo "$RESULT" | python3 -c "import sys,json; print(json.load(sys.stdin).get('ok',''))" 2>/dev/null || echo "")
              if [ "$OK" = "True" ]; then
                echo "✅ $label -> $CHANNEL 예약 완료"
              else
                ERROR=$(echo "$RESULT" | python3 -c "import sys,json; print(json.load(sys.stdin).get('error','unknown'))" 2>/dev/null || echo "parse_fail")
                echo "❌ $label -> $CHANNEL 실패: $ERROR"
              fi
              sleep 1
            done
          }

          echo "📅 기준 월요일: $MON"
          echo "목 $THU 19:00 / 금 $FRI 09:00·19:00 / 토 $SAT 19:00 / 일 $SUN 16:00"
          echo ""

          schedule_msg "$THU_TS"    "$MSG_THU"    "목요일 19:00"
          schedule_msg "$FRI_AM_TS" "$MSG_FRI_AM" "금요일 09:00"
          schedule_msg "$FRI_TS"    "$MSG_FRI"    "금요일 19:00"
          schedule_msg "$SAT_TS"    "$MSG_SAT"    "토요일 19:00"
          schedule_msg "$SUN_TS"    "$MSG_SUN"    "일요일 16:00"

          echo ""
          echo "✅ 예약 완료"
